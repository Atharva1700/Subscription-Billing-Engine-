# NOT EXECUTED here (no GitHub Actions run). Same commands were run locally.
name: billing-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m coverage run --branch --source=billing.domain -m pytest -q tests
      - run: python -m coverage report --fail-under=100
  mutation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m mutmut run || true
      - run: python -m mutmut export-cicd-stats && cat mutants/mutmut-cicd-stats.json
